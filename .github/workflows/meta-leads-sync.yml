name: Meta Leads — Sync diario

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 02:00 Madrid (hora de verano)
  workflow_dispatch:        # permite disparar manualmente desde GitHub UI

jobs:
  sync:
    name: Sincronizar leads de Meta
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Llamar endpoint sync-meta
        env:
          CRON_SECRET: ${{ secrets.META_LEADS_CRON_SECRET }}
        run: |
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --max-time 60 \
            --write-out "%{http_code}" \
            --output response.txt \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://assets-golden-next.vercel.app/api/leads/sync-meta")

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat response.txt

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: El endpoint devolvió HTTP $HTTP_STATUS (esperado 200)"
            exit 1
          fi
